<nav>
  <a class="projects-link" routerLink="/portfolio">Projects</a>
</nav>

<main>
  <div class="container" *ngIf="project">
    <h1 class="page-title">{{ project.title }}</h1>

    <div *ngFor="let section of project.sections">
      <!-- Seção de Texto -->
      <p class="content" *ngIf="section.type === 'text'">{{ section.content }}</p>

      <div class="technologies" *ngIf="section.type === 'tech'">
        <p>{{section.content}}</p>
      </div>

      <h3 class="title" *ngIf="section.type === 'title'">{{ section.content }}</h3>

      <div class="link-btn" *ngIf="section.type === 'link'" >
        <a [href]="section.content" target="_blank">{{section.name}}</a>
      </div>

      <!-- Seção de Imagem -->
      <div class="project-image" *ngIf="section.type === 'image'" >
        <img [src]="section.content" alt="Imagem do projeto">
      </div>

    </div>
  </div>

  <!-- Caso o projeto não exista -->
  <div *ngIf="!project">
    <p>Projeto não encontrado.</p>
  </div>

</main>
